[project]
name = "frame_and_caption"
version = "0.1.0"
description = "Frame images and add AI-generated captions using an OpenAI-compatible API"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.0",
    "Pillow>=10.0",
    "openai>=1.0",
    "tkinterdnd2>=0.4",
]

[project.scripts]
frame-and-caption = "frame_and_caption.app:main"
